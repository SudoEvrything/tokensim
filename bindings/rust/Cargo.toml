[package]
name = "tokensim"
version = "1.0.5"
edition = "2021"
description = "SIMD optimized fast tokenizer, 97x faster than tiktoken, 4.5x faster than gigatoken"
repository = "https://github.com/SudoEvrything/tokensim"
homepage = "https://github.com/SudoEvrything/tokensim"
documentation = "https://docs.rs/tokensim"
license-file = "csrc/LICENSE"
readme = "README.md"
keywords = ["tokenizer", "bpe", "nlp", "simd"]
categories = ["text-processing", "api-bindings"]
links = "tokensim"
build = "build.rs"
include = [
  "src/**",
  "csrc/**",
  "examples/**",
  "build.rs",
  "README.md",
]

[lib]
name = "tokensim"
path = "src/lib.rs"

[build-dependencies]
cc = "1"

[features]
default = []
