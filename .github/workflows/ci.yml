name: ci
on:
  push:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: version lockstep
        run: bash scripts/check_versions.sh

  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            cmake -S . -B build-clang -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          else
            cmake -S . -B build
          fi
      - name: build
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            cmake --build build-clang -j 4
          else
            cmake --build build -j 4
          fi
      - name: model-free smoke ctest
        run: |
          B=build; [ "${{ matrix.compiler }}" = "clang" ] && B=build-clang
          cd $B && ctest -R "test_unicode|test_json|test_bpe_short|test_cls_table|test_scheme_guard|test_avx512_probe|test_spm_tie_rule|test_decode" --output-on-failure

  build-test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: configure and build
        run: cmake -S . -B build && cmake --build build -j 4
      - name: model-free smoke ctest
        run: |
          cd build && ctest -R "test_unicode|test_json|test_bpe_short|test_cls_table|test_neon_classify|test_scheme_guard|test_spm_tie_rule|test_decode|test_parallel" --output-on-failure
      - name: native encode bench
        run: |
          cd build
          python3 - <<'PYEOF'
          import base64
          lines = []
          for b in range(256):
              lines.append(base64.b64encode(bytes([b])).decode() + f" {b}")
          open("/tmp/tiny.tiktoken", "w").write("\n".join(lines) + "\n")
          PYEOF
          printf 'The quick brown fox jumps over the lazy dog. In 2024, prices rose 3.5%% -- do not panic; email user@example.com or visit https://example.com/path?q=1.\nShe said, "I will arrive at 7:45 p.m. with 42 boxes, 3 cats, and one very large umbrella."\n\n' > /tmp/bench.txt
          for i in $(seq 1 131000); do cat /tmp/bench.txt; done > /tmp/bench16.txt
          ./tsimd-tokenize --format tiktoken /tmp/tiny.tiktoken cl100k --threads 4 /tmp/bench16.txt > /dev/null
          echo "native aarch64 4-thread encode of ~21 MB (the scalar serve):"
          TSIMD_SERVE_SW=0 time ./tsimd-tokenize --format tiktoken --threads 4 /tmp/tiny.tiktoken cl100k /tmp/bench16.txt > /dev/null
          echo "native aarch64 4-thread encode of ~21 MB (the neon-classified serve):"
          TSIMD_SERVE_SW=1 time ./tsimd-tokenize --format tiktoken --threads 4 /tmp/tiny.tiktoken cl100k /tmp/bench16.txt > /dev/null

  avx512-sde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build
        run: cmake -S . -B build && cmake --build build -j 4
      - name: SDE clone + the avx512 battery
        run: |
          git clone --depth 1 https://github.com/rapidfuzz/intel-sde /tmp/sde-mirror
          bash scripts/check_avx512_sde.sh
