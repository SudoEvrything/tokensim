name: release
on:
  push:
    tags: ["v*"]

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install build
      - run: python3 -m build --sdist
      - uses: actions/upload-artifact@v5
        with: {name: sdist, path: dist/*.tar.gz}

  wheels:
    needs: [sdist, versions]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: cibuildwheel
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_*"
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/check_versions.sh

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with: {path: artifacts}
      - name: publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: |
            artifacts/sdist/
            artifacts/wheels-ubuntu-latest/
            artifacts/wheels-macos-14/

  publish-crates:
    needs: [versions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/sync_crate.sh
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path bindings/rust/Cargo.toml || echo "already published at this version"
