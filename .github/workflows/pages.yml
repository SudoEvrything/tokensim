name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: render the markdown
        run: |
          mkdir -p site
          for f in README.md TECHNICAL-REPORT.md BENCHMARKS.md; do
            pandoc "$f" -f gfm -t html -s \
              --metadata title="tokensim - ${f%.md}" \
              --css style.css \
              -o "site/${f%.md}.html"
          done
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=TECHNICAL-REPORT.html">
          </head><body></body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
