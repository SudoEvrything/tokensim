name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: render the markdown
        run: |
          mkdir -p site
          for f in README.md TECHNICAL-REPORT.md BENCHMARKS.md; do
            pandoc "$f" -f gfm -t html5 -o "site/${f%.md}.frag"
          done
          python3 <<'PYEOF'
          import os
          css = """
          body {
              max-width: 52rem;
              margin: 2rem auto;
              padding: 0 1.5rem 0 2rem;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
              font-size: 16px;
              line-height: 1.7;
              color: #3d3d4e;
              background: #faf6ee;
          }
          h1, h2, h3, h4 {
              color: #2a2a3a;
              margin-top: 2rem;
              margin-left: -0.5rem;
              border-bottom: 1px solid #d8cfc0;
              padding-bottom: 0.3rem;
              padding-left: 0.5rem;
          }
          h1 { font-size: 2rem; }
          h2 { font-size: 1.4rem; }
          h3 { font-size: 1.15rem; }
          p { padding-left: 5px; }
          code, pre {
              background: #f0ece4;
              border-radius: 6px;
              font-family: "SF Mono", Consolas, "Liberation Mono", monospace;
          }
          code { padding: 0.15em 0.4em; font-size: 0.9em; }
          pre {
              padding: 1rem;
              overflow-x: auto;
              line-height: 1.45;
          }
          pre code { padding: 0; background: none; }
          table {
              border-collapse: collapse;
              width: 100%;
              margin: 1.5rem 0;
          }
          th, td {
              border: 1px solid #d8cfc0;
              padding: 0.5rem 0.8rem;
              text-align: left;
          }
          th { background: #f0ece4; font-weight: 600; }
          blockquote {
              border-left: 4px solid #8a7a5c;
              margin: 1rem 0;
              padding: 0.5rem 1rem;
              color: #5a5548;
              background: #f5f0e6;
              border-radius: 0 6px 6px 0;
          }
          a { color: #7a6a3a; }
          a:hover { color: #5a4a2a; text-decoration: underline; }
          hr { border: none; border-top: 2px solid #d8cfc0; margin: 2rem 0; }
          .repo-link {
              display: inline-block;
              margin-bottom: 1.5rem;
              font-size: 0.9em;
              color: #7a6a3a;
              text-decoration: none;
              font-weight: 500;
          }
          .repo-link:hover { text-decoration: underline; }
          """
          for md in ["README", "TECHNICAL-REPORT", "BENCHMARKS"]:
              frag = f"site/{md}.frag"
              if not os.path.isfile(frag):
                  continue
              body = open(frag).read()
              link = '<a class="repo-link" href="https://github.com/SudoEvrything/tokensim">tokensim on GitHub</a>\n'
              body = body.replace('<h2', link + '<h2', 1)
              html = f"""<!DOCTYPE html>
          <html>
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>{css}</style>
          </head>
          <body>
          {body}
          </body>
          </html>"""
              open(f"site/{md}.html", "w").write(html)
              os.remove(frag)
          open("site/index.html", "w").write(
              '<!DOCTYPE html><html><head><meta charset="utf-8">'
              '<meta http-equiv="refresh" content="0;url=TECHNICAL-REPORT.html">'
              '</head><body></body></html>')
          PYEOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
