name: pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: render the markdown
        run: |
          mkdir -p site
          for f in README.md TECHNICAL-REPORT.md BENCHMARKS.md; do
            pandoc "$f" -f gfm -t html -s \
              --metadata title="tokensim - ${f%.md}" \
              --css style.css \
              -o "site/${f%.md}.html"
          done
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8">
          <meta http-equiv="refresh" content="0;url=TECHNICAL-REPORT.html">
          </head><body></body></html>
          HTML
          cat > site/style.css <<'CSS'
          body {
              max-width: 52rem;
              margin: 2rem auto;
              padding: 0 1.5rem;
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
              font-size: 16px;
              line-height: 1.7;
              color: #1a1a2e;
              background: #fafbfc;
          }
          h1, h2, h3, h4 {
              color: #0d1117;
              margin-top: 2rem;
              border-bottom: 1px solid #d0d7de;
              padding-bottom: 0.3rem;
          }
          h1 { font-size: 2rem; }
          h2 { font-size: 1.4rem; }
          h3 { font-size: 1.15rem; }
          code, pre {
              background: #f0f2f5;
              border-radius: 6px;
              font-family: "SF Mono", Consolas, "Liberation Mono", monospace;
          }
          code { padding: 0.15em 0.4em; font-size: 0.9em; }
          pre {
              padding: 1rem;
              overflow-x: auto;
              line-height: 1.45;
          }
          pre code { padding: 0; background: none; }
          table {
              border-collapse: collapse;
              width: 100%;
              margin: 1.5rem 0;
          }
          th, td {
              border: 1px solid #d0d7de;
              padding: 0.5rem 0.8rem;
              text-align: left;
          }
          th { background: #f0f2f5; font-weight: 600; }
          blockquote {
              border-left: 4px solid #0969da;
              margin: 1rem 0;
              padding: 0.5rem 1rem;
              color: #57606a;
              background: #f6f8fa;
              border-radius: 0 6px 6px 0;
          }
          a { color: #0969da; }
          a:hover { text-decoration: underline; }
          hr { border: none; border-top: 2px solid #d0d7de; margin: 2rem 0; }
          .repo-link {
              display: inline-block;
              margin-bottom: 1.5rem;
              font-size: 0.9em;
              color: #0969da;
              text-decoration: none;
              font-weight: 500;
          }
          .repo-link:hover { text-decoration: underline; }
          CSS
          for f in site/README.html site/TECHNICAL-REPORT.html site/BENCHMARKS.html; do
            sed -i 's|</head>|<link rel="stylesheet" href="style.css"></head>|' "$f"
            sed -i 's|<body>|<body><a class="repo-link" href="https://github.com/SudoEvrything/tokensim">&#8592; github.com/SudoEvrything/tokensim</a><br>|' "$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
